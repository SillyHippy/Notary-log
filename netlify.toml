[build]
  base = "."
  command = "pnpm --filter @workspace/notary-journal... run build"
  publish = "artifacts/notary-journal/dist/public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Intake API (Netlify Blobs) — must be before SPA fallback
[[redirects]]
  from = "/api/intake/*"
  to = "/.netlify/functions/notary-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/notary-api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
