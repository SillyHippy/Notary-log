<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a5f">
  <title>Offline — Notary Journal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsl(210 40% 98%);
      color: hsl(222.2 84% 4.9%);
      padding: 1rem;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: hsl(222.2 84% 4.9%);
        color: hsl(210 40% 98%);
      }
    }
    .card {
      text-align: center;
      max-width: 360px;
      padding: 2rem;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { font-size: 0.9rem; line-height: 1.5; opacity: 0.75; margin-bottom: 1.5rem; }
    button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      border-radius: 0.5rem;
      background: hsl(215 60% 30%);
      color: white;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    .status { margin-top: 1rem; font-size: 0.8rem; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      No internet connection. Your journal entries are still available
      — any completed entries are stored securely on this device.
    </p>
    <button id="retry" aria-label="Try to reconnect">
      🔁 Retry Connection
    </button>
    <div class="status" id="status" aria-live="polite"></div>
  </div>
  <script>
    const btn = document.getElementById('retry');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
      status.textContent = 'Checking connection...';
      if (navigator.onLine) {
        status.textContent = 'Online! Reloading...';
        window.location.reload();
      } else {
        try {
          const resp = await fetch('/', { cache: 'no-cache' });
          if (resp.ok) {
            status.textContent = 'Back online! Reloading...';
            setTimeout(() => window.location.reload(), 500);
          }
        } catch {
          status.textContent = 'Still offline. Try again.';
        }
      }
    });

    window.addEventListener('online', () => {
      status.textContent = 'Connection restored! Reloading...';
      setTimeout(() => window.location.reload(), 500);
    });
    window.addEventListener('offline', () => {
      status.textContent = 'Connection lost.';
    });
  </script>
</body>
</html>
