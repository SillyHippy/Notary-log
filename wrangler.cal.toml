# Staging config for Cal-enabled Worker (NOT used by main auto-deploy).
# Deploy manually: pnpm run deploy:cloudflare:cal:staging

name = "notary-log-cal-staging"
main = "cloudflare/worker.ts"
compatibility_date = "2024-04-05"
account_id = "966abe0fc380ff8b07e6c7f138a0e921"

[[d1_databases]]
binding = "CAL_DB"
database_name = "notary-log-cal"
database_id = "c5b1d1da-96a1-42ee-a106-d3b8cb18af54"

[assets]
directory = "artifacts/notary-journal/dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
CAL_ENABLED = "1"
